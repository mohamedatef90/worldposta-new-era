# Sends a short summary of every repository event to an OpenBot webhook routine,
# which posts it to WhatsApp. No repository code is checked out or run here, so
# pull_request_target is safe and also covers PRs opened from forks.
name: Notify OpenBot

on:
  push:
  create:
  delete:
  fork:
  watch:
  public:
  release:
  issues:
  issue_comment:
  pull_request_target:
    types: [opened, edited, closed, reopened, synchronize, ready_for_review, converted_to_draft, review_requested, assigned, labeled]
  pull_request_review:
  pull_request_review_comment:
  discussion:
  discussion_comment:
  deployment_status:
  status:
  check_suite:
    types: [completed]
  gollum:
  milestone:
  label:
  branch_protection_rule:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send event summary
        env:
          WEBHOOK_URL: ${{ secrets.OPENBOT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.OPENBOT_WEBHOOK_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          DELIVERY_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_SECRET" ]; then
            echo "OpenBot secrets are not available for this event (for example a review from a fork). Skipping."
            exit 0
          fi

          # Keep the body small: only the fields the message needs.
          body=$(jq -c --arg type "github.$EVENT_NAME" '{
            type: $type,
            occurredAt: (now | todate),
            data: {
              event: $type | ltrimstr("github."),
              action: .action,
              repository: .repository.full_name,
              actor: .sender.login,
              ref: (.ref // .pull_request.head.ref // .check_suite.head_branch),
              ref_type: .ref_type,
              created: .created,
              deleted: .deleted,
              forced: .forced,
              commits: ((.commits // []) | length),
              head_commit: (.head_commit.message // null | if . then split("\n")[0] else . end),
              compare: .compare,
              pull_request: (if .pull_request then {
                number: .pull_request.number, title: .pull_request.title, state: .pull_request.state,
                merged: .pull_request.merged, base: .pull_request.base.ref, head: .pull_request.head.label,
                url: .pull_request.html_url } else null end),
              issue: (if .issue then { number: .issue.number, title: .issue.title, url: .issue.html_url } else null end),
              review: (if .review then { state: .review.state, url: .review.html_url } else null end),
              comment: (if .comment then { body: (.comment.body[0:200]), url: .comment.html_url } else null end),
              release: (if .release then { tag: .release.tag_name, name: .release.name, url: .release.html_url } else null end),
              forkee: .forkee.full_name,
              state: (.state // .deployment_status.state // .check_suite.conclusion),
              context: (.context // .deployment.environment),
              target_url: (.target_url // .deployment_status.target_url),
              url: (.pull_request.html_url // .issue.html_url // .release.html_url // .compare // .forkee.html_url // .repository.html_url)
            }
          }' "$GITHUB_EVENT_PATH")

          ts=$(date +%s)
          sig=$(printf '%s.%s.%s' "$ts" "$DELIVERY_ID" "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | sed 's/^.* //')

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "x-openbot-timestamp: $ts" \
            -H "x-openbot-delivery-id: $DELIVERY_ID" \
            -H "x-openbot-signature: sha256=$sig" \
            --data-binary "$body")
          echo "OpenBot responded $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
